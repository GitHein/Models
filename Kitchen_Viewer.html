<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Configurator</title>
    <style>
        body { margin:0; overflow:hidden; font-family:Arial, sans-serif; background:#0f0f0f; color:#eee; }
        #ui {
            position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.9); 
            padding: 12px; border-radius: 10px; width: 260px; z-index: 100; 
            max-height: 88vh; overflow-y: auto; font-size: 14px;
        }
        .section { margin: 12px 0; padding: 10px; background: rgba(255,255,255,0.07); border-radius: 8px; }
        label { display:block; margin: 6px 0 3px; font-size: 13px; }
        input[type="range"] { width: 100%; }
        button { width:100%; padding:9px; margin:4px 0; font-size:14px; border-radius:6px; }
        .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0 0 8px 0;">🎨 IdealKitchens <br>
        Hein 📡 079 999 2215</h2>
        <small id="modelName" style="color:#aaa;">Loading...</small>
        
        <div class="section">
            <input type="color" id="colorPicker" value="#e8d5b8" style="height:45px;width:100%;">
            <button id="applyColor">Apply Color</button>
            <button id="resetColors">Reset Colors</button>
        </div>

        <div class="section">
            <h3 style="margin:0 0 8px 0;">Lighting</h3>
            <label>Hemisphere <span id="hemiVal">0.8</span></label>
            <input type="range" id="hemiIntensity" min="0" max="2" step="0.05" value="0.8">

            <label>Sun Intensity <span id="dirVal">1.1</span></label>
            <input type="range" id="dirIntensity" min="0" max="3" step="0.05" value="1.1">

            <label>Exposure <span id="expVal">0.85</span></label>
            <input type="range" id="exposure" min="0.2" max="2.5" step="0.05" value="0.85">

            <label>Azimuth <span id="azVal">45</span>°</label>
            <input type="range" id="azimuth" min="0" max="360" step="5" value="45">

            <label>Elevation <span id="elVal">60</span>°</label>
            <input type="range" id="elevation" min="10" max="90" step="5" value="60">
        </div>

        <div class="section presets">
            <h3 style="margin:0 0 8px 0;">Presets</h3>
            <div class="presets">
                <button onclick="applyPreset(0)">Studio</button>
                <button onclick="applyPreset(1)">Daylight</button>
                <button onclick="applyPreset(2)">Warm</button>
                <button onclick="applyPreset(3)">Cool</button>
            </div>
        </div>

        <button id="resetAll">Reset All</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, selectedMesh, hemiLight, dirLight;

        const currentModel = new URLSearchParams(window.location.search).get('model') || 'scene.glb';
        document.getElementById('modelName').textContent = "📦 " + currentModel;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 300);
            camera.position.set(5, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.85;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(hemiLight);

            dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight.position.set(5, 10, 8);
            dirLight.castShadow = true;
            scene.add(dirLight);

            new THREE.GLTFLoader().load(currentModel, (gltf) => scene.add(gltf.scene));

            setupListeners();
            animate();
        }

        function setupListeners() {
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('click', onClick);
            renderer.domElement.addEventListener('contextmenu', onClick);

            // Lighting listeners
            ['hemiIntensity','dirIntensity','exposure','azimuth','elevation'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateLighting);
            });

            document.getElementById('applyColor').addEventListener('click', applyColor);
            document.getElementById('resetColors').addEventListener('click', resetColors);
            document.getElementById('resetAll').addEventListener('click', resetAllLighting);
        }

        function updateLighting() {
            hemiLight.intensity = parseFloat(document.getElementById('hemiIntensity').value);
            dirLight.intensity = parseFloat(document.getElementById('dirIntensity').value);
            renderer.toneMappingExposure = parseFloat(document.getElementById('exposure').value);

            document.getElementById('hemiVal').textContent = hemiLight.intensity.toFixed(1);
            document.getElementById('dirVal').textContent = dirLight.intensity.toFixed(1);
            document.getElementById('expVal').textContent = renderer.toneMappingExposure.toFixed(2);

            // Update sun position
            const az = parseFloat(document.getElementById('azimuth').value) * Math.PI / 180;
            const el = parseFloat(document.getElementById('elevation').value) * Math.PI / 180;
            const r = 20;
            dirLight.position.x = r * Math.cos(el) * Math.sin(az);
            dirLight.position.y = r * Math.sin(el);
            dirLight.position.z = r * Math.cos(el) * Math.cos(az);

            document.getElementById('azVal').textContent = document.getElementById('azimuth').value;
            document.getElementById('elVal').textContent = document.getElementById('elevation').value;
        }

        function onClick(event) {
            //if (event.button === 2) {
            //    event.preventDefault();
            //    if (selectedMesh && confirm("Delete?")) scene.remove(selectedMesh);
            //    selectedMesh = null;
            //    return;
            //}
            // Left click select logic...
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth)*2 -1,
                -(event.clientY / window.innerHeight)*2 +1
            );
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(scene.children, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj && !obj.material) obj = obj.parent;
                if (obj?.material) selectedMesh = obj;
            }
        }

        function applyColor() {
            if (selectedMesh?.material) selectedMesh.material.color.set(document.getElementById('colorPicker').value);
        }

        function resetColors() {
            scene.traverse(o => { if (o.material?.color) o.material.color.set(0xeeeeee); });
        }

        function resetAllLighting() {
            document.getElementById('hemiIntensity').value = 0.8;
            document.getElementById('dirIntensity').value = 1.1;
            document.getElementById('exposure').value = 0.85;
            document.getElementById('azimuth').value = 45;
            document.getElementById('elevation').value = 60;
            updateLighting();
        }

        function applyPreset(n) {
            const p = [[0.75,0.9,0.9,30,55],[0.9,1.35,0.95,180,65],[0.6,1.0,0.75,220,25],[0.85,0.95,0.8,80,45]][n];
            document.getElementById('hemiIntensity').value = p[0];
            document.getElementById('dirIntensity').value = p[1];
            document.getElementById('exposure').value = p[2];
            document.getElementById('azimuth').value = p[3];
            document.getElementById('elevation').value = p[4];
            updateLighting();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
