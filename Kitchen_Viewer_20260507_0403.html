<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kitchen Configurator</title>
    <style>
        body { 
            margin:0; overflow:hidden; font-family:Arial, sans-serif; 
            background:#0f0f0f; color:#eee; touch-action: none;
        }
        #ui {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.88); 
            padding: 14px; border-radius: 10px; width: 280px; z-index: 100; 
            max-height: 85vh; overflow-y: auto;
        }
        @media (max-width: 768px) {
            #ui { 
                width: 260px; 
                padding: 12px; 
                font-size: 14px;
            }
        }
        .section { 
            margin: 14px 0; padding: 12px; 
            background: rgba(255,255,255,0.08); border-radius: 8px; 
        }
        label { display:block; margin: 8px 0 4px; font-size: 13.5px; }
        input[type="range"] { width: 100%; }
        button { 
            width:100%; padding:10px; margin:5px 0; 
            font-size:15px; border-radius:6px;
        }
        .presets button { padding:9px; font-size:13px; }
        #modelName { font-size: 13px; color: #aaa; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🎨 Configurator</h2>
        <small id="modelName">Loading model...</small>
        <p><strong>Tap</strong> = Select | <strong>Long Press / Right Click</strong> = Delete</p>
        
        <div class="section">
            <input type="color" id="colorPicker" value="#e8d5b8" style="height:50px;">
            <button id="applyColor">Apply Color</button>
            <button id="resetColors">Reset Colors</button>
        </div>

        <div class="section">
            <h3>Lighting</h3>
            <label>Hemisphere <span id="hemiVal">0.8</span></label>
            <input type="range" id="hemiIntensity" min="0" max="2" step="0.05" value="0.8">

            <label>Sun Intensity <span id="dirVal">1.1</span></label>
            <input type="range" id="dirIntensity" min="0" max="3" step="0.05" value="1.1">

            <label>Exposure <span id="expVal">0.85</span></label>
            <input type="range" id="exposure" min="0.2" max="2.5" step="0.05" value="0.85">

            <label>Sun Azimuth <span id="azVal">45</span>°</label>
            <input type="range" id="azimuth" min="0" max="360" step="1" value="45">

            <label>Sun Elevation <span id="elVal">60</span>°</label>
            <input type="range" id="elevation" min="10" max="90" step="1" value="60">

            <label><input type="checkbox" id="shadows" checked> Enable Shadows</label>
        </div>

        <div class="section presets">
            <h3>Presets</h3>
            <button onclick="applyPreset(0)">Studio</button>
            <button onclick="applyPreset(1)">Daylight</button>
            <button onclick="applyPreset(2)">Warm Evening</button>
            <button onclick="applyPreset(3)">Cool Morning</button>
        </div>

        <button id="resetAll">Reset Lighting</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, selectedMesh;
        let hemiLight, dirLight;

        function getModelFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('model') || 'scene.glb';
        }

        const currentModel = getModelFromUrl();
        document.getElementById('modelName').textContent = "📦 " + currentModel;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 300);
            camera.position.set(5, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.85;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enableZoom = true;
            controls.screenSpacePanning = true;

            hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(hemiLight);

            dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight.position.set(5, 10, 8);
            dirLight.castShadow = true;
            scene.add(dirLight);

            new THREE.GLTFLoader().load(currentModel, (gltf) => {
                scene.add(gltf.scene);
                console.log("Loaded:", currentModel);
            });

            setupListeners();
            animate();
        }

        function setupListeners() {
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('click', onClick);
            renderer.domElement.addEventListener('contextmenu', onClick);
            
            document.getElementById('applyColor').addEventListener('click', applyColor);
            document.getElementById('resetColors').addEventListener('click', resetColors);
            document.getElementById('resetAll').addEventListener('click', resetAllLighting);
        }

        function onClick(event) {
            if (event.button === 2) {
                event.preventDefault();
                if (selectedMesh && confirm("Delete this part?")) scene.remove(selectedMesh);
                selectedMesh = null;
                return;
            }

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.material) obj = obj.parent;
                if (obj && obj.material) selectedMesh = obj;
            }
        }

        function applyColor() {
            if (selectedMesh && selectedMesh.material) {
                selectedMesh.material.color.set(document.getElementById('colorPicker').value);
            }
        }

        function resetColors() {
            scene.traverse((obj) => {
                if (obj.material && obj.material.color) obj.material.color.set(0xeeeeee);
            });
        }

        function resetAllLighting() {
            document.getElementById('hemiIntensity').value = 0.8;
            document.getElementById('dirIntensity').value = 1.1;
            document.getElementById('exposure').value = 0.85;
            document.getElementById('azimuth').value = 45;
            document.getElementById('elevation').value = 60;
            updateLighting();
            updateSunPosition();
        }

        // Lighting functions (same as before)
        function updateLighting() {
            hemiLight.intensity = parseFloat(document.getElementById('hemiIntensity').value);
            dirLight.intensity = parseFloat(document.getElementById('dirIntensity').value);
            renderer.toneMappingExposure = parseFloat(document.getElementById('exposure').value);
            document.getElementById('hemiVal').textContent = hemiLight.intensity.toFixed(1);
            document.getElementById('dirVal').textContent = dirLight.intensity.toFixed(1);
            document.getElementById('expVal').textContent = renderer.toneMappingExposure.toFixed(2);
        }

        function updateSunPosition() {
            const azimuth = parseFloat(document.getElementById('azimuth').value) * Math.PI / 180;
            const elevation = parseFloat(document.getElementById('elevation').value) * Math.PI / 180;
            const radius = 20;
            dirLight.position.x = radius * Math.cos(elevation) * Math.sin(azimuth);
            dirLight.position.y = radius * Math.sin(elevation);
            dirLight.position.z = radius * Math.cos(elevation) * Math.cos(azimuth);
            document.getElementById('azVal').textContent = document.getElementById('azimuth').value;
            document.getElementById('elVal').textContent = document.getElementById('elevation').value;
        }

        function applyPreset(n) {
            const presets = [
                { hemi: 0.75, dir: 0.9, exp: 0.9, az: 30, el: 55 },
                { hemi: 0.9, dir: 1.35, exp: 0.95, az: 180, el: 65 },
                { hemi: 0.6, dir: 1.0, exp: 0.75, az: 220, el: 25 },
                { hemi: 0.85, dir: 0.95, exp: 0.8, az: 80, el: 45 }
            ];
            const p = presets[n];
            document.getElementById('hemiIntensity').value = p.hemi;
            document.getElementById('dirIntensity').value = p.dir;
            document.getElementById('exposure').value = p.exp;
            document.getElementById('azimuth').value = p.az;
            document.getElementById('elevation').value = p.el;
            updateLighting();
            updateSunPosition();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
